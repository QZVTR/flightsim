<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spitfire Flight Sim</title>
  <style>
    body { margin:0; overflow:hidden; background:#000; }
    canvas { display:block; }
    #ui {
			position: absolute;
			top: 20px;
			left: 20px;
			color: #00ff00; 
			font-family: 'Courier New', monospace;
			background: rgba(0, 20, 0, 0.6);
			padding: 15px;
			border: 1px solid #00ff00;
			border-radius: 4px;
			text-shadow: 0 0 5px #00ff00;
			pointer-events: none;
		}
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(0, 255, 0, 0.5);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none; /* Don't block mouse clicks */
    }
    /* Optional: Add a small dot in the middle */
    #crosshair::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 2px;
      height: 2px;
      background: #0f0;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>
  <div id="ui"></div>
  <div id="crosshair"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/loaders/GLTFLoader.min.js"></script>
  
  <script type="module" src="js/main.js"></script>
</body>
</html>
